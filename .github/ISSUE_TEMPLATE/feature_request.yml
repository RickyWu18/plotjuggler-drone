name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: pj-version
    attributes:
      label: Target PlotJuggler version
      options:
        - PJ3 (3.x)
        - PJ4 (4.x)
        - Both
    validations:
      required: true
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - DataStreamMavlink
        - DataLoadArdupilot
        - New plugin
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Mention any alternatives you considered.
